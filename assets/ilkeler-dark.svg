<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" role="img" aria-label="Yapay zekayı ürüne güvenle bağlamak: yetki kodda, insan onayında, eval'le ölçülü">
  <style>
    .k1{animation:k1 14s ease-in-out infinite alternate}
    .k2{animation:k2 18s ease-in-out infinite alternate}
    @keyframes k1{to{transform:translate(70px,18px)}}
    @keyframes k2{to{transform:translate(-80px,-14px)}}
    @media (prefers-reduced-motion:reduce){.k1,.k2{animation:none}}
  </style>
  <rect width="880" height="170" rx="28" fill="#161b22"/>
  <text x="440" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle" letter-spacing="1.6">YAPAY ZEKAYI ÜRÜNE GÜVENLE BAĞLAMAK</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <g>
      <text x="147" y="70" font-size="22" font-weight="650" fill="#f5f5f7" letter-spacing="-.3">Yetki kodda.</text>
      <text x="147" y="100" font-size="14.5" fill="#a1a1a6">Kritik kuralı modele değil</text>
      <text x="147" y="121" font-size="14.5" fill="#a1a1a6">koda bırakırım.</text>
    </g>
    <g>
      <text x="440" y="70" font-size="22" font-weight="650" fill="#f5f5f7" letter-spacing="-.3">İnsan onayında.</text>
      <text x="440" y="100" font-size="14.5" fill="#a1a1a6">Geri dönüşü zor işlem</text>
      <text x="440" y="121" font-size="14.5" fill="#a1a1a6">onaysız çalışmaz.</text>
    </g>
    <line x1="294" y1="48" x2="294" y2="128" stroke="#30363d"/>
    <g>
      <text x="733" y="70" font-size="22" font-weight="650" fill="#f5f5f7" letter-spacing="-.3">Eval'le ölçülü.</text>
      <text x="733" y="100" font-size="14.5" fill="#a1a1a6">Modelin sızdırıp sızdırmadığını</text>
      <text x="733" y="121" font-size="14.5" fill="#a1a1a6">tahminle değil testle bilirim.</text>
    </g>
    <line x1="587" y1="48" x2="587" y2="128" stroke="#30363d"/>
  </g>
</svg>