<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Mehmet Ali Sevinç, Frontend Developer">
  <style>
    .k1{animation:k1 14s ease-in-out infinite alternate}
    .k2{animation:k2 18s ease-in-out infinite alternate}
    @keyframes k1{to{transform:translate(70px,18px)}}
    @keyframes k2{to{transform:translate(-80px,-14px)}}
    @media (prefers-reduced-motion:reduce){.k1,.k2{animation:none}}
  </style>
  <defs>
    <linearGradient id="yazi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a84ff"/><stop offset=".5" stop-color="#bf5af2"/><stop offset="1" stop-color="#ff375f"/>
    </linearGradient>
    <radialGradient id="isik1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0a84ff" stop-opacity=".16"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="isik2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#bf5af2" stop-opacity=".12"/><stop offset="1" stop-color="#bf5af2" stop-opacity="0"/></radialGradient>
  </defs>
  <clipPath id="c"><rect width="880" height="330" rx="28"/></clipPath>
  <rect width="880" height="330" rx="28" fill="#ffffff"/>
  <g clip-path="url(#c)">
    <ellipse class="k1" cx="250" cy="120" rx="320" ry="190" fill="url(#isik1)"/>
    <ellipse class="k2" cx="680" cy="230" rx="300" ry="170" fill="url(#isik2)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="440" y="92" font-size="17" font-weight="500" fill="#86868b" letter-spacing=".2">Merhaba, ben</text>
    <text x="440" y="160" font-size="62" font-weight="700" fill="#1d1d1f" letter-spacing="-1.6">Mehmet Ali Sevinç.</text>
    <text x="440" y="214" font-size="30" font-weight="600" fill="url(#yazi)" letter-spacing="-.5">Frontend Developer.</text>
    <text x="440" y="260" font-size="18" font-weight="400" fill="#6e6e73">4+ yıl React, React Native ve Electron. Şimdi .NET ve yapay zeka ajanları.</text>
  </g>
</svg>