<svg xmlns="http://www.w3.org/2000/svg" width="430" height="250" viewBox="0 0 430 250" role="img" aria-label="smart-plug-app: Priz, gerçek zamanlı.">
  <style>
    .k1{animation:k1 14s ease-in-out infinite alternate}
    .k2{animation:k2 18s ease-in-out infinite alternate}
    @keyframes k1{to{transform:translate(70px,18px)}}
    @keyframes k2{to{transform:translate(-80px,-14px)}}
    @media (prefers-reduced-motion:reduce){.k1,.k2{animation:none}}
  </style>
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff375f"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient>
    <radialGradient id="p" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ff375f" stop-opacity=".2"/><stop offset=".6" stop-color="#ff375f" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x=".5" y=".5" width="429" height="249" rx="24" fill="#161b22" stroke="#30363d"/>
  <clipPath id="c"><rect x=".5" y=".5" width="429" height="249" rx="24"/></clipPath>
  <g clip-path="url(#c)"><rect class="k2" x="-60" y="-20" width="560" height="300" fill="url(#p)"/></g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <circle cx="40" cy="42" r="8" fill="url(#v)"/>
    <text x="56" y="47" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">smart-plug-app</text>
    <text x="398" y="47" font-size="15" fill="#8b949e" text-anchor="end">↗</text>
    <text x="32" y="96" font-size="25" font-weight="700" fill="#f5f5f7" letter-spacing="-.6">Priz, gerçek zamanlı.</text>
    <text x="32" y="132" font-size="15" fill="#a1a1a6">Akıllı prizleri MQTT ile anlık kontrol eden</text>
    <text x="32" y="154" font-size="15" fill="#a1a1a6">IoT mobil uygulaması. Tasarım da bana ait.</text>
  </g>
  <g>
    <rect x="32" y="196" width="54" height="26" rx="13" fill="#21262d" stroke="#30363d"/>
    <text x="59.0" y="213.5" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#a1a1a6" text-anchor="middle">Expo</text>
    <rect x="94" y="196" width="113" height="26" rx="13" fill="#21262d" stroke="#30363d"/>
    <text x="150.5" y="213.5" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#a1a1a6" text-anchor="middle">React Native</text>
    <rect x="215" y="196" width="54" height="26" rx="13" fill="#21262d" stroke="#30363d"/>
    <text x="242.0" y="213.5" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#a1a1a6" text-anchor="middle">MQTT</text>
  </g>
</svg>