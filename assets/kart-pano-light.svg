<svg xmlns="http://www.w3.org/2000/svg" width="430" height="250" viewBox="0 0 430 250" role="img" aria-label="pano: Ajanlar, tek pencerede.">
  <style>
    .k1{animation:k1 14s ease-in-out infinite alternate}
    .k2{animation:k2 18s ease-in-out infinite alternate}
    @keyframes k1{to{transform:translate(70px,18px)}}
    @keyframes k2{to{transform:translate(-80px,-14px)}}
    @media (prefers-reduced-motion:reduce){.k1,.k2{animation:none}}
  </style>
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bf5af2"/><stop offset="1" stop-color="#5e5ce6"/></linearGradient>
    <radialGradient id="p" cx="1" cy="0" r="1"><stop offset="0" stop-color="#bf5af2" stop-opacity=".14"/><stop offset=".6" stop-color="#bf5af2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x=".5" y=".5" width="429" height="249" rx="24" fill="#f5f5f7" stroke="#e5e5ea"/>
  <clipPath id="c"><rect x=".5" y=".5" width="429" height="249" rx="24"/></clipPath>
  <g clip-path="url(#c)"><rect class="k2" x="-60" y="-20" width="560" height="300" fill="url(#p)"/></g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <circle cx="40" cy="42" r="8" fill="url(#v)"/>
    <text x="56" y="47" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#86868b">pano</text>
    <text x="398" y="47" font-size="15" fill="#86868b" text-anchor="end">↗</text>
    <text x="32" y="96" font-size="25" font-weight="700" fill="#1d1d1f" letter-spacing="-.6">Ajanlar, tek pencerede.</text>
    <text x="32" y="132" font-size="15" fill="#6e6e73">Claude Code ajanlarını ağaçta ve gömülü</text>
    <text x="32" y="154" font-size="15" fill="#6e6e73">terminallerde yöneten masaüstü uygulaması.</text>
  </g>
  <g>
    <rect x="32" y="196" width="83" height="26" rx="13" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="73.5" y="213.5" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6e6e73" text-anchor="middle">Electron</text>
    <rect x="123" y="196" width="83" height="26" rx="13" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="164.5" y="213.5" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6e6e73" text-anchor="middle">node-pty</text>
    <rect x="214" y="196" width="83" height="26" rx="13" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="255.5" y="213.5" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6e6e73" text-anchor="middle">xterm.js</text>
    <rect x="305" y="196" width="61" height="26" rx="13" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="335.5" y="213.5" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6e6e73" text-anchor="middle">Hooks</text>
  </g>
</svg>