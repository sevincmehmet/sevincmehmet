<svg xmlns="http://www.w3.org/2000/svg" width="430" height="250" viewBox="0 0 430 250" role="img" aria-label="org-tree-asistani: Yetkisi kodda olan AI ajanı.">
  <style>
    .k1{animation:k1 14s ease-in-out infinite alternate}
    .k2{animation:k2 18s ease-in-out infinite alternate}
    @keyframes k1{to{transform:translate(70px,18px)}}
    @keyframes k2{to{transform:translate(-80px,-14px)}}
    @media (prefers-reduced-motion:reduce){.k1,.k2{animation:none}}
  </style>
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#30d158"/><stop offset="1" stop-color="#0a84ff"/></linearGradient>
    <radialGradient id="p" cx="1" cy="0" r="1"><stop offset="0" stop-color="#30d158" stop-opacity=".14"/><stop offset=".6" stop-color="#30d158" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x=".5" y=".5" width="429" height="249" rx="24" fill="#f5f5f7" stroke="#e5e5ea"/>
  <clipPath id="c"><rect x=".5" y=".5" width="429" height="249" rx="24"/></clipPath>
  <g clip-path="url(#c)"><rect class="k2" x="-60" y="-20" width="560" height="300" fill="url(#p)"/></g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <circle cx="40" cy="42" r="8" fill="url(#v)"/>
    <text x="56" y="47" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#86868b">org-tree-asistani</text>
    <text x="398" y="47" font-size="15" fill="#86868b" text-anchor="end">↗</text>
    <text x="32" y="96" font-size="25" font-weight="700" fill="#1d1d1f" letter-spacing="-.6">Yetkisi kodda olan AI ajanı.</text>
    <text x="32" y="132" font-size="15" fill="#6e6e73">Google ADK ile iki ajanlı organizasyon asistanı.</text>
    <text x="32" y="154" font-size="15" fill="#6e6e73">İnsan onayı, geri alma ve güvenlik eval'i.</text>
  </g>
  <g>
    <rect x="32" y="196" width="98" height="26" rx="13" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="81.0" y="213.5" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6e6e73" text-anchor="middle">Google ADK</text>
    <rect x="138" y="196" width="68" height="26" rx="13" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="172.0" y="213.5" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6e6e73" text-anchor="middle">Gemini</text>
    <rect x="214" y="196" width="68" height="26" rx="13" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="248.0" y="213.5" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6e6e73" text-anchor="middle">Python</text>
    <rect x="290" y="196" width="61" height="26" rx="13" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="320.5" y="213.5" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6e6e73" text-anchor="middle">React</text>
  </g>
</svg>